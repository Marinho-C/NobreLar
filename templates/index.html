<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Nobre Lar - Otimizador de Cargas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="date"], button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #0056b3; color: white; border: none; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #004494; }
        #resultado { margin-top: 20px; padding: 20px; background: #e9ecef; border-radius: 4px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background-color: #0056b3; color: white; }
        .resumo-kpi { display: flex; justify-content: space-between; margin-top: 15px; font-weight: bold; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema de Montagem de Carga</h1>
        <p style="text-align: center; color: #666;">Grupo Nobre Lar - Centro de Distribuição Crateús</p>
        
        <div class="form-group">
            <label for="data-viagem">Data da Viagem:</label>
            <input type="date" id="data-viagem">
        </div>

        <div class="form-group">
            <label for="eixo">Selecione o Eixo de Entrega:</label>
            <select id="eixo">
                <option value="1">Eixo 1: Buriti dos Montes</option>
                <option value="2">Eixo 2: Sucesso, Tamboril, Nova Russas, Fazenda</option>
                <option value="3">Eixo 3: Independência</option>
                <option value="4">Eixo 4: Ipaporanga, Poranga, Ararendá</option>
                <option value="5">Eixo 5: Novo Oriente, Realejo, Santana, Monte Nebo, Santo André, Quiterianópolis</option>
            </select>
        </div>

        <button onclick="gerarCarga()">Gerar Plano de Carga Otimizado</button>

        <div id="resultado">
            <h3>Plano de Carga (Romaneio da Expedição)</h3>
            <p id="mensagem-status"></p>
            
            <div class="resumo-kpi">
                <div>Peso Alocado: <span id="kpi-peso">0 kg</span> (<span id="pct-peso">0%</span>)</div>
                <div>Volume Alocado: <span id="kpi-volume">0 m³</span> (<span id="pct-volume">0%</span>)</div>
            </div>

            <h4>Pedidos Alocados na Rota:</h4>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cidade</th>
                            <th>ID Pedido</th>
                            <th>Valor (R$)</th>
                            <th>Peso (kg)</th>
                            <th>Volume (m³)</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-pedidos">
                        <!-- Os dados processados pelo Python entrarão aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
        function gerarCarga() {
            const dataViagem = document.getElementById('data-viagem').value;
            const eixoEscolhido = document.getElementById('eixo').value;

            if (!dataViagem) {
                alert('Por favor, selecione a data da viagem!');
                return;
            }

            fetch('/processar-carga', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    eixo: eixoEscolhido,
                    data: dataViagem 
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'erro') {
                    alert(data.mensagem);
                    return;
                }

                const divResultado = document.getElementById('resultado');
                divResultado.style.display = 'block';
                
                document.getElementById('mensagem-status').innerHTML = `<strong>${data.mensagem}</strong>`;
                document.getElementById('kpi-peso').innerText = data.peso_total;
                document.getElementById('pct-peso').innerText = data.ocupacao_peso;
                document.getElementById('kpi-volume').innerText = data.volume_total;
                document.getElementById('pct-volume').innerText = data.ocupacao_volume;

                // Preenche a tabela dinamicamente com os dados reais vindos do Python
                const tbody = document.getElementById('tabela-pedidos');
                tbody.innerHTML = ''; // Limpa a tabela anterior

                data.pedidos.forEach(item => {
                    let linha = `
                        <tr>
                            <td>${item.cidade}</td>
                            <td>${item.pedido}</td>
                            <td>R$ ${item.valor.toFixed(2)}</td>
                            <td>${item.peso_total} kg</td>
                            <td>${item.volume_total} m³</td>
                        </tr>
                    `;
                    tbody.innerHTML += linha;
                });
            })
            .catch(error => console.error('Erro:', error));
        }
    </script>
</body>
</html>
